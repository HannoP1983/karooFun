<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Karoo Fun – Party-Pace wins the race!</title>
<style>
  :root {
    --ink: #1F2328;
    --w: 480px;
    --h: 642px;
    --num: "Arial Rounded MT Bold", sans-serif;
    --hand: "Chalkboard SE", "Comic Sans MS", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: var(--w); height: var(--h); background: #fff; overflow: hidden; }

  .tile {
    position: relative; width: var(--w); height: var(--h);
    border: 3.5px solid var(--ink); border-radius: 20px; overflow: hidden;
    background: #2A1B5C;
  }
  .tile::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 1;
    background-image: radial-gradient(rgba(255,255,255,.08) 1.3px, transparent 1.5px);
    background-size: 7px 7px;
  }
  .stage { position: absolute; inset: 0; z-index: 2; }
  .art { position: absolute; inset: 0; width: 100%; height: 100%; }

  .outline {
    color: #fff;
    text-shadow:
      -3px -3px 0 var(--ink), 3px -3px 0 var(--ink), -3px 3px 0 var(--ink), 3px 3px 0 var(--ink),
       0 -3px 0 var(--ink), 0 3px 0 var(--ink), -3px 0 0 var(--ink), 3px 0 0 var(--ink),
       6px 6px 0 var(--ink);
  }
  .banner {
    position: absolute; left: 22px; right: 22px; top: 176px; z-index: 3; text-align: center;
    background: #FF4FA3; border: 4px solid var(--ink); border-radius: 26px; box-shadow: 6px 6px 0 var(--ink);
    padding: 14px 8px 16px; font-family: var(--num); line-height: 1;
  }
  .banner .l1 { font-size: 52px; display: block; color: #FFE135; letter-spacing: -1px; }
  .banner .l2 { font-size: 34px; display: block; margin-top: 8px; }

  .panel {
    position: absolute; z-index: 4; left: 18px; right: 18px; bottom: 22px; height: 118px;
    background: #22B8A6; border: 3.5px solid var(--ink); border-radius: 22px; box-shadow: 5px 5px 0 var(--ink);
    display: flex; align-items: center; justify-content: space-between; padding: 0 18px;
  }
  .panel .cap { font-family: var(--hand); font-weight: bold; font-size: 15px; margin-bottom: 2px; color: var(--ink); }
  .panel .speed { font-family: var(--num); font-size: 58px; line-height: 1; }
  .panel .speed small { font-size: 20px; margin-left: 3px; }
  .panel .chips { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
  .panel .chip {
    font-family: var(--num); font-size: 21px; line-height: 1; padding: 6px 10px;
    background: #fff; border: 3px solid var(--ink); border-radius: 16px; box-shadow: 3px 3px 0 var(--ink);
    color: var(--ink); white-space: nowrap;
  }
  .panel .chip small { font-size: 13px; margin-left: 2px; }
</style>
</head>
<body>
<div class="tile">
  <div class="stage" id="stage"></div>
</div>

<script>
// URL hash: "#" plays the 3 s takeover at 5 fps (and repeats), "#2" renders a fixed frame.
const frame = location.hash.slice(1);
const INK = '#1F2328';
const FRAMES = 15;
const ride = { speed: 25.4, avg: 25.1, hr: 138, zone: 2, steadyMinutes: 24 };
const fmt = (v, d) => v.toFixed(d).replace('.', ',');
const COLORS = ['#FF4FA3', '#FFE135', '#22B8A6', '#4FA3F0', '#FF9F1C', '#A884F3'];

// Spotlights sweeping from the disco ball, swapping colors every frame.
function spotlights(t) {
  return Array.from({length: 6}, (_, i) => {
    const a = (i / 6) * Math.PI + 0.25 + Math.sin(t * 0.9 + i) * 0.18;
    const x = 240 + 700 * Math.cos(a), y = 92 + 700 * Math.sin(a);
    const x2 = 240 + 700 * Math.cos(a + 0.16), y2 = 92 + 700 * Math.sin(a + 0.16);
    return `<path d="M240 92 L${x.toFixed(0)} ${y.toFixed(0)} L${x2.toFixed(0)} ${y2.toFixed(0)} Z" fill="${COLORS[(i + t) % COLORS.length]}" opacity=".28"/>`;
  }).join('');
}

// The disco ball drops in on a string during the first frames, then spins.
function discoBall(t) {
  const drop = t < 3 ? [-110, -30, 8][t] : (t % 2 ? 4 : 0);
  const cy = 92 + drop;
  let tiles = '';
  for (let row = -3; row <= 3; row++) {
    for (let col = -3; col <= 3; col++) {
      const x = 240 + col * 13 + ((t % 2) * 6), y = cy + row * 13;
      if (Math.hypot(x - 240, y - cy) > 40) continue;
      tiles += `<rect x="${x - 6}" y="${y - 6}" width="12" height="12" fill="${(row + col + t) % 3 === 0 ? '#fff' : (row + col + t) % 3 === 1 ? '#C9D3E0' : '#8A97AA'}"/>`;
    }
  }
  const glints = t % 2 ? `<g stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="M200 ${cy - 30} l-10 -10 M282 ${cy - 26} l10 -10 M290 ${cy + 20} l12 4"/></g>` : '';
  return `
    <path d="M240 0 V${cy - 44}" stroke="${INK}" stroke-width="3"/>
    <clipPath id="ball"><circle cx="240" cy="${cy}" r="44"/></clipPath>
    <g clip-path="url(#ball)">${tiles}</g>
    <circle cx="240" cy="${cy}" r="44" fill="none" stroke="${INK}" stroke-width="4"/>
    ${glints}`;
}

function confetti(t) {
  return Array.from({length: 28}, (_, i) => {
    const x = (i * 67) % 470 + 5 + ((t + i) % 2 ? 6 : -6);
    const y = ((i * 41) % 520) - 60 + t * (14 + (i % 4) * 5);
    const yy = ((y % 560) + 560) % 560;
    const rot = t * 50 + i * 37;
    const color = COLORS[i % COLORS.length];
    return i % 3 === 0
      ? `<circle cx="${x}" cy="${yy}" r="5" fill="${color}" stroke="${INK}" stroke-width="2"/>`
      : `<rect x="${x - 4}" y="${yy - 7}" width="8" height="14" rx="2" transform="rotate(${rot} ${x} ${yy})" fill="${color}" stroke="${INK}" stroke-width="2"/>`;
  }).join('');
}

function beer(x, y, scale, tilt, t, i) {
  const bubbles = [[-10, 0], [2, 13], [11, 26]].map(([bx, off]) => {
    const by = 24 - ((t * 7 + off + i * 9) % 40);
    return `<circle cx="${bx}" cy="${by}" r="2.5" fill="#FFF3B0"/>`;
  }).join('');
  return `
    <g transform="translate(${x} ${y}) rotate(${tilt}) scale(${scale})">
      <path d="M22 -12 C42 -12 42 22 22 22" fill="none" stroke="${INK}" stroke-width="10" stroke-linecap="round"/>
      <path d="M22 -12 C42 -12 42 22 22 22" fill="none" stroke="#FFF7DA" stroke-width="4" stroke-linecap="round"/>
      <rect x="-24" y="-22" width="48" height="58" rx="7" fill="#FFF7DA" stroke="${INK}" stroke-width="3.5"/>
      <rect x="-19" y="-16" width="38" height="47" rx="4" fill="#FFB627"/>
      <path d="M-9 -12 V26 M9 -12 V26" stroke="#FFD46B" stroke-width="3" stroke-linecap="round"/>
      ${bubbles}
      <path d="M-28 -16 C-36 -30 -18 -42 -8 -32 C-2 -46 22 -42 18 -30 C34 -34 36 -14 25 -14 L25 -4 Q20 4 15 -4 L15 -12 Q8 -8 -2 -12 Q-14 -8 -28 -16 Z"
            fill="#fff" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>
    </g>`;
}

// Two mugs clinking every other beat, with a splash and a "Prost!".
function cheers(t) {
  const clink = t % 4 === 1 || t % 4 === 2;
  const splash = clink ? `
    <g stroke="${INK}" stroke-width="2" fill="#FFB627">
      <path d="M100 86 q-6 -10 0 -16 q6 6 0 16 Z"/><path d="M88 92 q-12 -4 -14 -12 q10 0 14 12 Z"/><path d="M112 92 q12 -4 14 -12 q-10 0 -14 12 Z"/>
    </g>
    <g fill="#fff" stroke="${INK}" stroke-width="2"><circle cx="82" cy="72" r="4"/><circle cx="120" cy="70" r="3.5"/><circle cx="100" cy="60" r="3"/></g>` : '';
  const prost = clink ? `
    <g transform="translate(40 34) rotate(-6)">
      <rect x="0" y="0" width="74" height="28" rx="14" fill="#FFF6D6" stroke="${INK}" stroke-width="2.5"/>
      <path d="M50 27 l6 9 l2 -9 Z" fill="${INK}"/>
      <text x="37" y="20" text-anchor="middle" font-family="Chalkboard SE" font-weight="bold" font-size="16" fill="${INK}">Prost!</text>
    </g>` : '';
  return `
    ${beer(clink ? 74 : 62, 128, 1, clink ? 18 : 6, t, 0)}
    <g transform="translate(${clink ? 126 : 138} 128) scale(-1 1)">${beer(0, 0, 1, clink ? 18 : 6, t, 1)}</g>
    ${splash}${prost}`;
}

function pretzel(x, y, scale, t) {
  const d = 'M-26 16 C-48 -4 -32 -38 -4 -24 C10 -16 8 6 -16 20 M26 16 C48 -4 32 -38 4 -24 C-10 -16 -8 6 16 20 M-30 24 Q0 2 30 24';
  return `
    <g transform="translate(${x} ${y + (t % 2 ? -4 : 0)}) rotate(${t % 2 ? -8 : 4}) scale(${scale})">
      <path d="${d}" fill="none" stroke="${INK}" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="${d}" fill="none" stroke="#B8742A" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      <g fill="#fff"><circle cx="-30" cy="-6" r="2"/><circle cx="-14" cy="-28" r="2"/><circle cx="16" cy="-27" r="2"/><circle cx="32" cy="-4" r="2"/><circle cx="0" cy="12" r="2"/></g>
    </g>`;
}

// Bike with a party hat on a spotlit dance floor, hopping to the beat.
function partyBike(t) {
  const hop = t % 2 ? -10 : 0;
  const frame = 'M11 23 L22 8 L40 8 L47 23 M22 8 L30 23 L40 8 M30 23 L11 23 M20 4 L26 4 M40 8 L38 2 L44 2';
  return `
    <ellipse cx="240" cy="482" rx="128" ry="20" fill="#FFE135" stroke="${INK}" stroke-width="3.5"/>
    <ellipse cx="240" cy="482" rx="${t % 2 ? 70 : 90}" ry="${t % 2 ? 9 : 12}" fill="#FFF3B0"/>
    <g transform="translate(173 ${404 + hop}) scale(2.3)">
      <g stroke-linejoin="round" stroke-linecap="round" fill="none">
        <circle cx="11" cy="23" r="9" fill="#fff" stroke="${INK}" stroke-width="2.6"/>
        <circle cx="47" cy="23" r="9" fill="#fff" stroke="${INK}" stroke-width="2.6"/>
        <g transform="rotate(${t * 45} 11 23)" stroke="${INK}"><path d="M2 23 h18 M11 14 v18" stroke-width="1.6"/></g>
        <g transform="rotate(${t * 45} 47 23)" stroke="${INK}"><path d="M38 23 h18 M47 14 v18" stroke-width="1.6"/></g>
        <path d="${frame}" stroke="${INK}" stroke-width="4.6"/>
        <path d="${frame}" stroke="#FF4FA3" stroke-width="2"/>
      </g>
      <path d="M17 4 L23 -14 L29 4 Z" fill="#FFE135" stroke="${INK}" stroke-width="2" stroke-linejoin="round"/>
      <path d="M19.5 -2 L26.5 -2 M21 -8 L25 -8" stroke="#22B8A6" stroke-width="2"/>
      <circle cx="23" cy="-15" r="3" fill="#22B8A6" stroke="${INK}" stroke-width="1.5"/>
    </g>
    <g stroke="#FFE135" stroke-width="3.5" stroke-linecap="round" opacity="${t % 2 ? 1 : 0}">
      <path d="M156 420 l-14 -8 M152 444 l-16 0 M324 420 l14 -8 M328 444 l16 0"/>
    </g>`;
}

function render(t) {
  const showBanner = t >= 2 && t < FRAMES - 1;
  const bannerTilt = t === 2 ? -9 : (t % 2 ? -3 : -1);
  const bannerScale = t === 2 ? 1.12 : (t >= FRAMES - 2 ? 0.9 : 1);
  const diff = ride.speed - ride.avg;

  document.getElementById('stage').innerHTML = `
    <svg class="art" viewBox="0 0 480 642">
      ${spotlights(t)}
      ${confetti(t)}
      ${cheers(t)}${pretzel(404, 140, 1.1, t)}${beer(62, 436, 0.95, (t % 2 ? -8 : 6), t, 2)}${beer(418, 436, 0.95, (t % 2 ? 8 : -6), t, 3)}
      ${discoBall(t)}
      ${partyBike(t)}
    </svg>
    ${showBanner ? `
    <div class="banner" style="transform: rotate(${bannerTilt}deg) scale(${bannerScale})">
      <span class="l1 outline">PARTY-PACE</span>
      <span class="l2 outline">wins the race!</span>
    </div>` : ''}
    <!-- Fixed layer, refreshed once per second, so it stays readable. -->
    <div class="panel">
      <div>
        <div class="cap">Tempo · Ø ${fmt(ride.avg, 1)} km/h</div>
        <div class="speed outline">${fmt(ride.speed, 1)}<small>km/h</small></div>
      </div>
      <div class="chips">
        <div class="chip">♥ Z${ride.zone} · ${ride.hr}</div>
        <div class="chip">⏱ ${ride.steadyMinutes}<small>min</small> konstant</div>
      </div>
    </div>`;
}

if (frame !== '') {
  render(Number(frame));
} else {
  let t = 0;
  render(t);
  setInterval(() => { t = (t + 1) % (FRAMES + 5); render(Math.min(t, FRAMES - 1)); }, 200);
}
</script>
</body>
</html>
