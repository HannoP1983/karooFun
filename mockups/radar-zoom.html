<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Karoo Fun – Regenradar mit Karte und Zoom</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #2b2b2b; color: #eee; font-family: "Chalkboard SE", sans-serif; padding: 24px; width: 1300px; }
  h1 { font-size: 26px; margin-bottom: 4px; }
  h2 { font-size: 20px; margin: 22px 0 4px; color: #FFD23F; }
  p.note { font-size: 14px; color: #bbb; margin-bottom: 10px; max-width: 1240px; }
  ul.note { font-size: 14px; color: #ccc; margin: 0 0 10px 20px; max-width: 1220px; line-height: 1.5; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; }
  .frame { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 13px; color: #aaa; }
  .page { position: relative; width: 478px; height: 642px; transform: scale(.82); transform-origin: top left; margin-right: -86px; margin-bottom: -115px; }
  .page canvas, .page svg { position: absolute; left: 0; top: 0; }
</style>
</head>
<body>
<h1>Regenradar: Karte, Standort, Maßstab, Zoom</h1>
<p class="note">Echte Daten von heute Abend rund um München: graue Karte von basemap.de (amtliche Deutschlandkarte, frei mit Quellenangabe), DWD-Radar in den Original-Farben halbtransparent darüber. Ganze Karoo-Seite 478 × 642 px, hier 0,82×.</p>
<div id="out"></div>
<script>
const INK = '#1F2328', W = 478, H = 642;
const MAP_TOP = 52, MAP_H = 494;
const ZOOMS = { 10: { scale: 2, blur: 6 }, 25: { scale: 5, blur: 2.5 }, 50: { scale: 10, blur: 1.2 } };

const load = src => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = 'radar/' + src; });

/* DWD colours unchanged, only softened so the 1 km pixels don't look blocky when zoomed in */
function radarLayer(img, blur) {
  const c = document.createElement('canvas'); c.width = W; c.height = MAP_H;
  const x = c.getContext('2d'); x.filter = `blur(${blur}px)`; x.drawImage(img, 0, 0);
  return c;
}

function overlay({ zoom, label, badge, message, current, heading = 52, buttons = true }) {
  const cx = W / 2, cy = MAP_TOP + MAP_H / 2;
  const { scale } = ZOOMS[zoom];
  const barPx = scale / zoom * W;
  let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
    <defs><pattern id="dots" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="3.5" cy="3.5" r="1.3" fill="rgba(0,0,0,.07)"/></pattern></defs>`;
  // Position: dot with a heading cone
  s += `<g transform="translate(${cx},${cy})">
    <g transform="rotate(${heading})"><path d="M0,0 L-16,-38 Q0,-46 16,-38 Z" fill="rgba(255,122,28,.5)" stroke="${INK}" stroke-width="2"/></g>
    <circle r="12" fill="${INK}" transform="translate(2.5,2.5)"/><circle r="12" fill="#fff" stroke="${INK}" stroke-width="3"/><circle r="7" fill="#FF7A1C"/></g>`;
  // Scale bar bottom left
  const sx = 14, sy = MAP_TOP + MAP_H - 22;
  s += `<rect x="${sx - 6}" y="${sy - 22}" width="${barPx + 12}" height="36" rx="8" fill="rgba(255,246,214,.92)" stroke="${INK}" stroke-width="2"/>
    <rect x="${sx}" y="${sy}" width="${barPx / 2}" height="7" fill="${INK}"/><rect x="${sx + barPx / 2}" y="${sy}" width="${barPx / 2}" height="7" fill="#fff" stroke="${INK}" stroke-width="2"/>
    <text x="${sx}" y="${sy - 6}" font-family="Arial Rounded MT Bold" font-size="13" fill="${INK}">0</text>
    <text x="${sx + barPx}" y="${sy - 6}" text-anchor="end" font-family="Arial Rounded MT Bold" font-size="13" fill="${INK}">${scale} km</text>`;
  // Zoom buttons bottom right, big enough for gloves
  if (buttons) {
    for (const [i, sym] of [[0, '+'], [1, '−']]) {
      const bx = W - 40, by = MAP_TOP + MAP_H - 110 + i * 62;
      s += `<circle cx="${bx + 3}" cy="${by + 3}" r="25" fill="${INK}"/><circle cx="${bx}" cy="${by}" r="25" fill="#fff" stroke="${INK}" stroke-width="3"/>
        <text x="${bx}" y="${by + 11}" text-anchor="middle" font-family="Arial Rounded MT Bold" font-size="32" fill="${INK}">${sym}</text>`;
    }
  }
  s += `<text x="${W - 8}" y="${MAP_TOP + MAP_H - 6}" text-anchor="end" font-family="Helvetica" font-size="9" fill="#444">© basemap.de / BKG · DWD</text>`;
  // Header
  s += `<rect x="0" y="0" width="${W}" height="${MAP_TOP}" fill="#6EC3FF"/><rect x="0" y="0" width="${W}" height="${MAP_TOP}" fill="url(#dots)"/>
    <line x1="0" y1="${MAP_TOP}" x2="${W}" y2="${MAP_TOP}" stroke="${INK}" stroke-width="3"/>
    <g transform="rotate(-2 80 26)"><rect x="13" y="11" width="150" height="32" rx="13" fill="${INK}"/><rect x="10" y="8" width="150" height="32" rx="13" fill="#FFF6D6" stroke="${INK}" stroke-width="3"/>
    <text x="85" y="31" text-anchor="middle" font-family="Chalkboard SE" font-weight="bold" font-size="20" fill="${INK}">Regenradar</text></g>
    <rect x="${W - 175}" y="11" width="160" height="32" rx="16" fill="${INK}"/><rect x="${W - 178}" y="8" width="160" height="32" rx="16" fill="${badge}" stroke="${INK}" stroke-width="3"/>
    <text x="${W - 98}" y="31" text-anchor="middle" font-family="Arial Rounded MT Bold" font-size="18" fill="${INK}">${label}</text>`;
  // Bottom: message and timeline
  const y0 = MAP_TOP + MAP_H;
  s += `<rect x="0" y="${y0}" width="${W}" height="${H - y0}" fill="#FFF6D6"/><rect x="0" y="${y0}" width="${W}" height="${H - y0}" fill="url(#dots)"/>
    <line x1="0" y1="${y0}" x2="${W}" y2="${y0}" stroke="${INK}" stroke-width="3"/>
    <text x="16" y="${y0 + 30}" font-family="Chalkboard SE" font-weight="bold" font-size="22" fill="${INK}">${message}</text>`;
  const tx0 = 28, tx1 = W - 28, ty = y0 + 54;
  s += `<line x1="${tx0}" y1="${ty}" x2="${tx1}" y2="${ty}" stroke="${INK}" stroke-width="3" stroke-linecap="round"/>`;
  [-60, -45, -30, -15, 0, 30, 60].forEach(m => {
    const x = tx0 + (m + 60) / 120 * (tx1 - tx0), on = m === current, fc = m > 0;
    s += `<circle cx="${x}" cy="${ty}" r="${on ? 10 : 6}" fill="${on ? (fc ? '#FFD23F' : '#4FA8F2') : fc ? '#FFF1A8' : '#fff'}" stroke="${INK}" stroke-width="2.5"/>`;
    if (m % 30 === 0) s += `<text x="${x}" y="${ty + 23}" text-anchor="middle" font-family="Chalkboard SE" font-weight="bold" font-size="13" fill="${INK}">${m === 0 ? 'jetzt' : (m > 0 ? '+' : '−') + Math.abs(m)}</text>`;
  });
  s += `<rect x="1.75" y="1.75" width="${W - 3.5}" height="${H - 3.5}" rx="18" fill="none" stroke="${INK}" stroke-width="3.5"/></svg>`;
  return s;
}

async function page({ zoom, radar, ...rest }) {
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d');
  x.drawImage(await load(`bm_${zoom}.jpg`), 0, MAP_TOP);
  x.globalAlpha = 0.6;
  x.drawImage(radarLayer(await load(radar), ZOOMS[zoom].blur), 0, MAP_TOP);
  x.globalAlpha = 1;
  const div = document.createElement('div'); div.className = 'page';
  div.appendChild(c);
  div.insertAdjacentHTML('beforeend', overlay({ zoom, ...rest }));
  return div;
}

const MSG = 'Nass – und es bleibt nass';
(async () => {
  const out = document.getElementById('out');
  const section = async (title, note, items) => {
    out.insertAdjacentHTML('beforeend', `<h2>${title}</h2>${note}`);
    const row = document.createElement('div'); row.className = 'row'; out.appendChild(row);
    for (const item of items) {
      const f = document.createElement('div'); f.className = 'frame';
      f.appendChild(await page(item));
      f.insertAdjacentHTML('beforeend', `<span>${item.caption}</span>`);
      row.appendChild(f);
    }
  };
  const now = { label: 'jetzt · 19:45', badge: '#fff', message: MSG, current: 0 };
  await section('Zoomstufen', '<p class="note">Drei Stufen: 10, 25 und 50 km Kartenbreite. Der Maßstab unten links passt sich an (2 / 5 / 10 km). Auf 10 km wird das 1-km-Radar weich gezeichnet, damit es nicht klötzchenhaft aussieht. Deine Position bleibt immer in der Mitte, der Kegel zeigt die Fahrtrichtung.</p>', [
    { zoom: 10, radar: 'rz_10.png', caption: '10 km · Stadtteil', ...now },
    { zoom: 25, radar: 'rz_25.png', caption: '25 km · Standard', ...now },
    { zoom: 50, radar: 'rz_50.png', caption: '50 km · Überblick', ...now },
  ]);
  await section('Animation (25 km)', '<p class="note">Ein Bild pro Sekunde: letzte Stunde in 15-Minuten-Schritten, dann Prognose (gelb markiert), dann ein paar Sekunden Pause auf „jetzt“. Die Ansage unten wird aus Radar und Prognose genau an deiner Position berechnet.</p>', [
    { zoom: 25, radar: 'rz_25_m60.png', caption: 'vor 60 min', label: '18:45', badge: '#fff', message: MSG, current: -60 },
    { zoom: 25, radar: 'rz_25.png', caption: 'jetzt', ...now },
    { zoom: 25, radar: 'rz_25_p30.png', caption: 'Prognose +30 min', label: 'Prognose 20:15', badge: '#FFD23F', message: MSG, current: 30 },
  ]);
  out.insertAdjacentHTML('beforeend', `<h2>Wie wird gezoomt?</h2><ul class="note">
    <li><b>Antippen der Knöpfe +/−</b> auf der Seite: am direktesten. Ob der Karoo Tipp-Gesten an Erweiterungs-Felder weiterreicht, muss ich auf deinem Karoo ausprobieren.</li>
    <li><b>Hardware-Tasten:</b> Das SDK bietet „Bonus-Aktionen“, die man im Karoo auf Tasten legen kann, z. B. „Radar rein“ / „Radar raus“. Klappt sicher, auch mit Handschuhen.</li>
    <li><b>Automatisch nach Tempo</b> als Zusatz: langsam (Stadt) 10 km, normal 25 km, schnell 50 km – solange du nicht selbst gezoomt hast.</li>
    <li>Falls Tippen nicht geht, fallen die +/− weg und die Seite sieht aus wie unten.</li></ul>`);
  await section('Ohne Tipp-Knöpfe', '', [{ zoom: 25, radar: 'rz_25.png', caption: 'Zoom nur über Tasten', buttons: false, ...now }]);
})();
</script>
</body>
</html>
