<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Karoo Fun – Ganze Seite</title>
<style>
  :root {
    --ink: #1F2328;
    --w: 480px;
    --h: 642px;
    --num: "Arial Rounded MT Bold", sans-serif;
    --hand: "Chalkboard SE", "Comic Sans MS", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: var(--w); height: var(--h); background: #fff; overflow: hidden; }

  .tile {
    position: relative; width: var(--w); height: var(--h);
    border: 3.5px solid var(--ink); border-radius: 20px; overflow: hidden;
    color: var(--ink);
  }
  .bg, .overlay { position: absolute; inset: 0; width: 100%; height: 100%; }
  .overlay { z-index: 3; pointer-events: none; }
  .tile::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 1;
    background-image: radial-gradient(rgba(0,0,0,.09) 1.3px, transparent 1.5px);
    background-size: 7px 7px;
  }

  .cells {
    position: absolute; left: 0; right: 0; top: 0; height: 321px; z-index: 2;
    display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;
  }
  .cell {
    position: relative; overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }

  .label {
    position: absolute; top: 10px; left: 12px; z-index: 5; white-space: nowrap;
    font-family: var(--hand); font-weight: bold; font-size: 14px; line-height: 1;
    background: #FFF6D6; border: 2.5px solid var(--ink); border-radius: 12px;
    padding: 4px 9px 3px; box-shadow: 2.5px 2.5px 0 var(--ink);
    transform: rotate(-3deg);
  }
  .label::after {
    content: ""; position: absolute; left: 12px; bottom: -8px;
    border: 6px solid transparent; border-top: 7px solid var(--ink); border-bottom: 0;
  }
  .label.tail-right::after { left: auto; right: 12px; }
  .cell:nth-child(even) .label { left: auto; right: 12px; transform: rotate(3deg); }

  .outline {
    color: #fff;
    text-shadow:
      -2.5px -2.5px 0 var(--ink), 2.5px -2.5px 0 var(--ink), -2.5px 2.5px 0 var(--ink), 2.5px 2.5px 0 var(--ink),
       0 -2.5px 0 var(--ink), 0 2.5px 0 var(--ink), -2.5px 0 0 var(--ink), 2.5px 0 0 var(--ink),
       5px 5px 0 var(--ink);
  }
  .value {
    position: relative; z-index: 4; line-height: 1;
    font-family: var(--num); font-size: 50px; letter-spacing: -1px;
  }
  .value small { font-size: .38em; letter-spacing: 0; margin-left: 3px; }

  /* ---------- Speed ---------- */
  .speed .value { font-size: 48px; margin-top: 16px; }
  .avg {
    position: relative; z-index: 4; margin-top: 6px; display: flex; align-items: center; gap: 6px;
    font-family: var(--num); font-size: 26px; line-height: 1;
  }
  .avg small { font-size: 13px; margin-left: -2px; color: var(--ink); text-shadow: none; }
  .avg .arrow {
    width: 24px; height: 24px; border-radius: 50%; background: #fff;
    border: 2.5px solid var(--ink); box-shadow: 2px 2px 0 var(--ink);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; color: var(--ink); text-shadow: none;
  }
  .streaks { position: absolute; z-index: 3; left: 0; top: 0; width: 100%; height: 100%; }
  .snail { position: absolute; z-index: 3; bottom: 4px; width: 40px; height: 26px; }

  /* ---------- Temperature ---------- */
  .icicles { position: absolute; top: -4px; left: 0; width: 100%; height: 40px; z-index: 3; }
  .flake { position: absolute; z-index: 3; font-size: 16px; color: #fff;
    text-shadow: -1.5px -1.5px 0 var(--ink), 1.5px 1.5px 0 var(--ink), 1.5px -1.5px 0 var(--ink), -1.5px 1.5px 0 var(--ink); }
  .frost { position: absolute; z-index: 2; inset: 0; width: 100%; height: 100%; }
  .drift { position: absolute; z-index: 3; left: 0; bottom: -2px; width: 100%; height: 32px; }
  .temp.freeze .label { top: 36px; left: 12px; right: auto; transform: rotate(-3deg); background: #E6F6FF; }
  .temp.freeze .value { color: #E9F8FF; margin-top: 34px; }
  .snowcap { position: absolute; left: -6px; top: -13px; width: calc(100% + 10px); height: 20px; }
  .shiver { position: absolute; z-index: 4; width: 14px; height: 30px; top: 82px; }

  .flames { position: absolute; bottom: -6px; left: 0; width: 100%; height: 40px; z-index: 3; transform-origin: bottom center; }
  .heat { position: absolute; z-index: 3; top: 8px; left: 16px; width: 26px; height: 30px; }
  .sweat { position: absolute; z-index: 5; width: 14px; height: 20px; }

  .sun { position: absolute; z-index: 2; left: -18px; top: -18px; width: 76px; height: 76px; }
  .cloud { position: absolute; z-index: 2; bottom: 10px; width: 60px; height: 29px; }

  /* ---------- Heart rate ---------- */
  .zones { position: relative; z-index: 4; display: flex; gap: 4px; margin-top: 8px; margin-left: 34px; align-items: center; }
  .zones span { width: 22px; height: 9px; border-radius: 5px; border: 2px solid var(--ink); background: rgba(255,255,255,.5); }
  .zones span.on { background: #fff; height: 13px; box-shadow: 2px 2px 0 var(--ink); }
  .zones span.on.beat { height: 17px; width: 26px; }
  .heartbg { position: absolute; z-index: 3; width: 34px; height: 34px; left: 12px; bottom: 8px; }
  .beatmarks { position: absolute; z-index: 3; width: 56px; height: 56px; left: 3px; bottom: 0; }
  .hr .value { margin-top: 14px; }

  /* ---------- Distance ---------- */
  .road { position: absolute; z-index: 3; left: 0; right: 0; bottom: 14px; height: 3px;
    background: repeating-linear-gradient(90deg, var(--ink) 0 14px, transparent 14px 24px); opacity: .5; }
  .bike { position: absolute; z-index: 3; bottom: 16px; width: 46px; height: 28px; }
  .dust { position: absolute; z-index: 3; bottom: 18px; width: 26px; height: 16px; }
  .post { position: absolute; z-index: 3; right: 12px; bottom: 16px; width: 30px; height: 40px; }
  .dist .value { margin-top: -6px; }

  /* ---------- Elevation profile ---------- */
  .profile { position: absolute; left: 0; right: 0; top: 321px; bottom: 0; z-index: 4; pointer-events: none; }
  .stat { position: absolute; top: 18px; }
  .stat .cap { font-family: var(--hand); font-weight: bold; font-size: 13px; margin-bottom: 3px; }
  .stat .num { font-family: var(--num); font-size: 34px; line-height: 1; }
  .stat .num small { font-size: 15px; margin-left: 2px; }
  .badge {
    position: absolute; right: 14px; top: 26px;
    font-family: var(--num); font-size: 30px; line-height: 1; padding: 6px 12px 6px;
    border: 3px solid var(--ink); border-radius: 22px; box-shadow: 3px 3px 0 var(--ink);
  }
  .badge small { font-size: 15px; margin-left: 2px; }
  .footer { position: absolute; left: 14px; right: 14px; bottom: 12px; display: flex; align-items: center; justify-content: space-between;
    font-family: var(--hand); font-weight: bold; font-size: 14px; }
  .legend { display: flex; gap: 7px; }
  .legend span { display: flex; align-items: center; gap: 3px; font-size: 12px; }
  .legend i { width: 13px; height: 13px; border: 2px solid var(--ink); border-radius: 4px; display: inline-block; }
</style>
</head>
<body>
<div class="tile">
  <svg class="bg" viewBox="0 0 480 642" preserveAspectRatio="none" id="bg"></svg>
  <div class="cells" id="cells"></div>
  <svg class="overlay" viewBox="0 0 480 642" preserveAspectRatio="none" id="overlay"></svg>
  <div class="profile" id="profile"></div>
</div>

<script>
const scenarios = {
  kalt:   { speed: 21.4, avg: 24.8, temp: -3.2, hr: 128, dist: 12.37 },
  normal: { speed: 26.3, avg: 25.2, temp: 14.6, hr: 151, dist: 41.05 },
  heiss:  { speed: 32.6, avg: 27.1, temp: 31.7, hr: 176, dist: 68.42 },
};
// URL hash: "#kalt" animates live once per second, "#kalt/2" renders a fixed frame.
const [name, frame] = location.hash.slice(1).split('/');
const base = scenarios[name] || scenarios.normal;

const INK = '#1F2328';
const W = 480, H = 642, MID = 160, SPLIT = 321;
const fmt = (v, d) => v.toFixed(d).replace('.', ',');
const pick = (list, t, every = 4) => list[Math.floor(t / every) % list.length];
const zonesMax = [114, 133, 152, 171];

// Hand-drawn, wobbly region borders instead of a strict grid.
const e = {
  top: 'C250 50 226 110 240 160', topRev: 'C226 110 250 50 236 0',
  left: 'C70 168 160 150 240 160', leftRev: 'C160 150 70 168 0 157',
  right: 'C320 172 400 152 480 163', rightRev: 'C400 152 320 172 240 160',
  bottom: 'C254 215 230 270 244 321', bottomRev: 'C230 270 254 215 240 160',
  pLeft: 'C80 334 170 310 244 321', pLeftRev: 'C170 310 80 334 0 324',
  pRight: 'C320 332 400 306 480 318', pRightRev: 'C400 306 320 332 244 321',
};

const bands = [
  { from: -Infinity, color: '#3B8CFF', label: '<0', text: 'Wuiii!' },
  { from: 0, color: '#3DDC6A', label: '0-3', text: 'Rollt!' },
  { from: 3, color: '#F5D324', label: '3-6', text: 'Zieht an' },
  { from: 6, color: '#FF9A1F', label: '6-9', text: 'Rampe!' },
  { from: 9, color: '#FF4D3D', label: '9-12', text: 'Autsch!' },
  { from: 12, color: '#D23CFF', label: '12+', text: 'Wand!!' },
];
const bandOf = g => bands.filter(b => g >= b.from).pop();

/* ---------- Demo ride: same made-up alpine profile as the elevation project, cut at the ridden distance ---------- */
function demoProfile(km) {
  const n = Math.max(40, Math.round(km * 7));
  const pts = [];
  let el = 380;
  for (let i = 0; i <= n; i++) {
    const d = i / n * km;
    const target = 520 + 300 * Math.sin(d / 6) + 160 * Math.sin(d / 2.3 + 1) +
      260 * Math.max(0, Math.sin(d / 3.4 - 2)) + (d > 44 ? 420 * Math.min(1, (d - 44) / 11) : 0);
    el += (target - el) * 0.12;
    pts.push({ d: d * 1000, e: el });
  }
  const grades = pts.map((_, i) => {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
    return (b.e - a.e) / (b.d - a.d) * 100;
  });
  const ascent = pts.slice(1).reduce((sum, p, i) => sum + Math.max(0, p.e - pts[i].e), 0);
  return { pts, grades, ascent };
}

function background(colors, prof) {
  return `
  <defs>
    <linearGradient id="ice" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E3F6FF"/><stop offset="1" stop-color="#7FCBF0"/></linearGradient>
    <radialGradient id="fire" cx=".55" cy="1" r="1"><stop offset="0" stop-color="#FFC23D"/><stop offset=".55" stop-color="#FF7A2E"/><stop offset="1" stop-color="#E9452E"/></radialGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6EC3FF"/><stop offset="1" stop-color="#CFEBFF"/></linearGradient>
  </defs>
  <path d="M0 0 L236 0 ${e.top} ${e.leftRev} Z" fill="${colors.speed}"/>
  <path d="M236 0 L480 0 L480 163 ${e.rightRev} ${e.topRev} Z" fill="${colors.temp}"/>
  <path d="M0 157 ${e.left} ${e.bottom} ${e.pLeftRev} Z" fill="${colors.hr}"/>
  <path d="M240 160 ${e.right} L480 318 ${e.pRightRev} ${e.bottomRev} Z" fill="${colors.dist}"/>
  <path d="M0 324 ${e.pLeft} ${e.pRight} L480 642 L0 642 Z" fill="url(#sky)"/>
  ${prof}
  <g fill="none" stroke="${INK}" stroke-width="3" stroke-linecap="round">
    <path d="M236 0 ${e.top}" stroke-dasharray="0 18 120 400"/>
    <path d="M240 160 ${e.bottom}" stroke-dasharray="0 22 120 400"/>
    <path d="M0 157 ${e.left}" stroke-dasharray="0 26 190 400"/>
    <path d="M240 160 ${e.right}" stroke-dasharray="0 22 190 400"/>
    <path d="M0 324 ${e.pLeft} ${e.pRight}" stroke-dasharray="0 30 420 800"/>
  </g>`;
}

/* ---------- Speed: wind streaks when fast, a snail when slow ---------- */
function speedCell(s, t) {
  const above = s.speed >= s.avg;
  let deco;
  if (above) {
    const shift = (t % 3) * 6;
    const lines = [[50, 4, 26], [64, 10, 18], [78, 2, 24], [140, 150, 40], [150, 120, 24]]
      .map(([y, x, len]) => `<path d="M${x + shift} ${y} h${len}" />`).join('');
    deco = `<svg class="streaks" viewBox="0 0 240 160"><g stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".75">${lines}</g></svg>`;
  } else {
    const x = 12 + (t * 12) % 170;
    deco = `
      <svg class="snail" viewBox="0 0 40 26" style="left:${x}px">
        <path d="M2 24 L30 24 Q36 24 36 18 L36 12" fill="none" stroke="${INK}" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M2 24 Q10 22 34 24 L30 22" fill="#F7E3A1" stroke="${INK}" stroke-width="2.5" stroke-linejoin="round"/>
        <circle cx="18" cy="14" r="9" fill="#E9A86B" stroke="${INK}" stroke-width="2.5"/>
        <path d="M18 14 m0 -4 a4 4 0 1 1 -4 4" fill="none" stroke="${INK}" stroke-width="2"/>
        <path d="M34 12 L32 4 M37 12 L39 5" stroke="${INK}" stroke-width="2" stroke-linecap="round"/>
        <circle cx="32" cy="4" r="1.8" fill="${INK}"/><circle cx="39" cy="5" r="1.8" fill="${INK}"/>
      </svg>`;
  }
  const label = above ? pick(['Zoom!', 'Wuuusch!', 'Turbo!'], t) : pick(['Tempo', 'Tret rein!', 'Schneckentempo'], t);
  return `
    <div class="cell speed">
      ${deco}
      <div class="label">${label}</div>
      <div class="value outline">${fmt(s.speed, 1)}</div>
      <div class="avg outline"><span class="arrow">${above ? '▲' : '▼'}</span>Ø ${fmt(s.avg, 1)}<small>km/h</small></div>
    </div>`;
}

/* ---------- Temperature: falling snow / flickering fire / turning sun ---------- */
const snowcap = `<svg class="snowcap" viewBox="0 0 160 20" preserveAspectRatio="none">
    <path d="M4 16 C8 4 22 6 30 9 C40 2 56 4 64 10 C74 3 92 5 100 10 C110 2 128 4 136 9 C146 4 158 8 156 16 C140 20 20 20 4 16 Z" fill="#fff" stroke="${INK}" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M30 16 l0 5 M98 16 l0 6 M130 16 l0 4" stroke="${INK}" stroke-width="2" stroke-linecap="round"/>
  </svg>`;

function freezeDeco(t) {
  const heights = [18, 30, 13, 36, 21, 15, 31, 20, 12, 28, 16, 25];
  const icicles = heights.map((h, i) => {
    const x = i * 20;
    const phase = (t + i) % 3;
    const drop = h > 27 ? `<path d="M${x + 10} ${h + 3 + phase * 7} q-3 4 0 6 q3 -2 0 -6 Z" fill="#BFE6FA" stroke="${INK}" stroke-width="1.5"/>` : '';
    return `<path d="M${x} 0 L${x + 20} 0 Q${x + 14} ${h * .6} ${x + 10} ${h} Q${x + 6} ${h * .6} ${x} 0 Z" fill="#F4FBFF" stroke="${INK}" stroke-width="2" stroke-linejoin="round"/>
            <path d="M${x + 6} 4 L${x + 9} ${h * .7}" stroke="#9FD6F2" stroke-width="2" stroke-linecap="round"/>${drop}`;
  }).join('');
  const crystal = (cx, cy, r, rot) => `<g transform="translate(${cx} ${cy}) rotate(${rot})" stroke="#7CC4EA" stroke-width="2" stroke-linecap="round" fill="none">
      ${[0, 60, 120].map(a => `<g transform="rotate(${a})"><path d="M${-r} 0 L${r} 0 M${r * .5} 0 l${r * .25} ${-r * .25} M${r * .5} 0 l${r * .25} ${r * .25} M${-r * .5} 0 l${-r * .25} ${-r * .25} M${-r * .5} 0 l${-r * .25} ${r * .25}"/></g>`).join('')}
    </g>`;
  const fern = (x, y, dir) => `<g transform="translate(${x} ${y}) scale(1.4) translate(${-x} ${-y})" stroke="#7CC4EA" stroke-width="2.5" stroke-linecap="round" fill="none">
      <path d="M${x} ${y} q${dir * 26} -10 ${dir * 46} -42"/>
      ${[0.25, 0.5, 0.75].map(k => `<path d="M${x + dir * 46 * k} ${y - 42 * k * k - 6 * k} l${dir * 10} 4 M${x + dir * 46 * k} ${y - 42 * k * k - 6 * k} l${dir * -2} -11"/>`).join('')}
    </g>`;
  const flakes = [[20, 30, 16], [176, 10, 11], [104, 50, 12], [204, 25, 19], [150, 70, 11], [62, 80, 14]]
    .map(([x, y0, size], i) => {
      const y = 40 + (y0 + t * (8 + i * 3)) % 90;
      const sway = (t + i) % 2 ? 4 : -4;
      return `<div class="flake" style="left:${x + sway}px; top:${y}px; font-size:${size}px">❄</div>`;
    }).join('');
  const jitter = t % 2 ? 2 : -2;
  const shiver = `<path d="M7 2 q6 4 0 8 q-6 4 0 8 q6 4 0 8" fill="none" stroke="${INK}" stroke-width="2.5" stroke-linecap="round"/>`;
  return {
    deco: `
      <svg class="frost" viewBox="0 0 240 160" preserveAspectRatio="none">
        <path d="M14 56 L60 22 M30 96 L90 50 M150 120 L214 72" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".55"/>
        ${fern(4, 160, 1)}${fern(236, 160, -1)}
        ${crystal(30, 64, 8, 10 + t * 15)}${crystal(212, 96, 7, 25 - t * 15)}
      </svg>
      <svg class="icicles" viewBox="0 0 240 40" preserveAspectRatio="none">${icicles}</svg>
      <svg class="drift" viewBox="0 0 240 32" preserveAspectRatio="none">
        <path d="M0 32 L0 18 C20 8 40 11 58 18 C76 24 92 10 118 11 C144 13 150 22 172 19 C196 16 214 6 240 13 L240 32 Z" fill="#fff" stroke="${INK}" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M70 24 q14 -5 26 -3 M180 24 q12 -3 22 -2" stroke="#BFE6FA" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      </svg>
      ${flakes}
      <svg class="shiver" viewBox="0 0 14 30" style="left:${8 + jitter}px">${shiver}</svg>
      <svg class="shiver" viewBox="0 0 14 30" style="right:${8 - jitter}px">${shiver}</svg>`,
    valueStyle: `transform: translateX(${jitter}px)`,
    label: pick(['Brrr!', 'Bibber!', 'Eisig!'], t),
  };
}

function hotDeco(t) {
  const flameTransform = ['scale(1,1)', 'scale(-1,.82)', 'scale(1,1.15)'][t % 3];
  return {
    deco: `
      <svg class="heat" viewBox="0 0 30 34" fill="none" stroke="${INK}" stroke-width="2.5" stroke-linecap="round" style="transform: translateY(${t % 2 ? -4 : 0}px)">
        <path d="M6 32 C2 26 10 22 6 16 C2 10 10 6 6 2"/><path d="M15 32 C11 26 19 22 15 16 C11 10 19 6 15 2"/><path d="M24 32 C20 26 28 22 24 16 C20 10 28 6 24 2"/>
      </svg>
      <svg class="flames" viewBox="0 0 240 48" preserveAspectRatio="none" style="transform:${flameTransform}">
        <path d="M0 48 C8 32 14 36 18 20 C24 34 32 30 36 10 C42 32 54 28 58 18 C64 36 74 32 80 6 C86 32 96 30 102 16 C108 34 118 30 124 4 C130 32 140 30 146 16 C152 34 162 30 168 8 C174 32 184 30 190 18 C196 36 206 32 212 10 C218 32 228 30 232 20 C236 34 238 36 240 32 L240 48 Z"
              fill="#D9301C" stroke="${INK}" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M8 48 C16 38 22 40 28 30 C34 40 44 38 50 28 C58 40 66 38 74 26 C82 40 92 38 100 30 C108 42 118 38 124 26 C132 40 142 38 150 30 C158 42 168 38 174 28 C182 40 192 38 200 28 C208 40 218 38 224 32 C230 42 232 44 236 48 Z"
              fill="#FFD166" stroke="${INK}" stroke-width="2" stroke-linejoin="round"/>
      </svg>
      <svg class="sweat" viewBox="0 0 14 20" style="right:18px; top:${52 + (t % 3) * 16}px">
        <path d="M7 1 Q13 11 7 19 Q1 11 7 1 Z" fill="#BFE6FA" stroke="${INK}" stroke-width="2"/>
      </svg>`,
    valueStyle: 'margin-top: -8px',
    label: pick(['Puh, heiß!', 'Glutofen!', 'Schwitz!'], t),
  };
}

function normalDeco(t) {
  const rays = Array.from({length: 10}, (_, i) => {
    const a = i * Math.PI / 5 + t * Math.PI / 20;
    return `<line x1="38" y1="38" x2="${38 + 36 * Math.cos(a)}" y2="${38 + 36 * Math.sin(a)}"/>`;
  }).join('');
  return {
    deco: `
      <svg class="sun" viewBox="0 0 76 76"><g stroke="${INK}" stroke-width="3" stroke-linecap="round">${rays}<circle cx="38" cy="38" r="20" fill="#FF9F1C"/></g></svg>
      <svg class="cloud" viewBox="0 0 66 32" style="left:${(10 + t * 6) % 170}px">
        <path d="M10 29 C0 29 0 17 10 17 C10 5 28 3 32 13 C38 3 56 7 54 19 C66 19 66 29 56 29 Z" fill="#fff" stroke="${INK}" stroke-width="2.5"/>
      </svg>`,
    valueStyle: '',
    label: pick(['Temp', 'Herrlich!'], t),
  };
}

function tempCell(s, t, state) {
  const d = { freeze: freezeDeco, hot: hotDeco, normal: normalDeco }[state](t);
  return `
    <div class="cell temp ${state}">
      ${d.deco}
      <div class="label">${d.label}</div>
      <div class="value outline" style="${d.valueStyle}">${state === 'freeze' ? snowcap : ''}${fmt(s.temp, 1)}<small>°C</small></div>
    </div>`;
}

/* ---------- Heart rate: heart beats once per second, harder in high zones ---------- */
function hrCell(s, t, zone) {
  const beat = t % 2 === 0;
  const scale = beat ? (zone >= 4 ? 1.35 : 1.2) : .95;
  const tilt = zone >= 5 ? (beat ? -18 : 6) : -12;
  const marks = beat && zone >= 3
    ? `<svg class="beatmarks" viewBox="0 0 60 60"><g stroke="${INK}" stroke-width="2.5" stroke-linecap="round"><path d="M10 14 l-6 -6 M30 6 l0 -5 M50 14 l6 -6"/></g></svg>` : '';
  const labels = [['Chillig'], ['Locker'], ['Läuft'], ['Ackern!', 'Boom!'], ['Bumm-bumm!', 'Vollgas!']][zone - 1];
  const labelTilt = zone >= 5 ? (beat ? -6 : 2) : -3;
  return `
    <div class="cell hr">
      ${marks}
      <svg class="heartbg" viewBox="0 0 100 100" style="transform: rotate(${tilt}deg) scale(${scale})"><path d="M50 88 C20 66 6 50 6 32 C6 18 17 8 30 8 C40 8 46 14 50 22 C54 14 60 8 70 8 C83 8 94 18 94 32 C94 50 80 66 50 88 Z" fill="#fff" stroke="${INK}" stroke-width="7" stroke-linejoin="round"/></svg>
      <div class="label" style="transform: rotate(${labelTilt}deg)">${pick(labels, t)} · Z${zone}</div>
      <div class="value outline">${s.hr}<small>bpm</small></div>
      <div class="zones">${[1,2,3,4,5].map(z => `<span class="${z === zone ? 'on' + (beat ? ' beat' : '') : ''}"></span>`).join('')}</div>
    </div>`;
}

/* ---------- Distance: rolling road, spinning wheels, next km post ---------- */
function distCell(s, t) {
  const x = Math.min(140, 10 + (s.dist % 10) * 13);
  const spin = t * 45;
  const wheel = cx => `<g transform="rotate(${spin} ${cx} 23)"><circle cx="${cx}" cy="23" r="9" fill="#fff"/><path d="M${cx - 9} 23 h18 M${cx} 14 v18" stroke-width="1.8"/></g>`;
  const puff = t % 2 ? 'scale(1)' : 'scale(.6)';
  return `
    <div class="cell dist">
      <div class="label">${pick(['Distanz', 'Kilometerfresser', 'Weiter so!'], t)}</div>
      <div class="value outline">${fmt(s.dist, 2)}<small>km</small></div>
      <div class="road" style="background-position-x:${-t * 10}px"></div>
      <svg class="dust" viewBox="0 0 26 16" style="left:${x - 22}px; transform:${puff}">
        <g fill="#fff" stroke="${INK}" stroke-width="2"><circle cx="18" cy="9" r="5"/><circle cx="8" cy="10" r="4"/></g>
      </svg>
      <svg class="bike" viewBox="0 0 58 34" style="left:${x}px">
        <g stroke="${INK}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" fill="none">
          ${wheel(11)}${wheel(47)}
          <path d="M11 23 L22 8 L40 8 L47 23 M22 8 L30 23 L40 8 M30 23 L11 23 M20 4 L26 4 M40 8 L38 2 L44 2"/>
        </g>
      </svg>
      <svg class="post" viewBox="0 0 30 40">
        <path d="M15 18 V40" stroke="${INK}" stroke-width="3"/>
        <rect x="2" y="2" width="26" height="18" rx="4" fill="#fff" stroke="${INK}" stroke-width="2.5"/>
        <text x="15" y="16" text-anchor="middle" font-family="Arial Rounded MT Bold" font-size="12" fill="${INK}">${Math.floor(s.dist) + 1}</text>
      </svg>
    </div>`;
}

/* ---------- Elevation profile: grade-colored mountains, summit flag, rider on the slope ---------- */
const CHART = { left: 14, right: 466, top: 432, bottom: 590 };

function profileGeometry(p) {
  const { pts } = p;
  const span = Math.max(pts[pts.length - 1].d, 2000);
  const lo = Math.min(...pts.map(q => q.e)), hi = Math.max(...pts.map(q => q.e));
  const range = Math.max(hi - lo, 40);
  const top = hi + (range - (hi - lo)) / 2 + range * 0.08;
  const bottom = top - range * 1.14;
  const x = i => CHART.left + pts[i].d / span * (CHART.right - CHART.left);
  const y = i => CHART.bottom - (pts[i].e - bottom) / (top - bottom) * (CHART.bottom - CHART.top);
  return { x, y, lo, hi };
}

// Mountains go into the background layer so the halftone dots print over them.
function profileFills(p, t) {
  const { pts, grades } = p;
  const { x, y } = profileGeometry(p);
  const clouds = [[60, 372, 0.9], [300, 352, 0.7], [400, 392, 0.8]].map(([cx, cy, k], i) => {
    const dx = ((cx + t * (3 + i)) % 520) - 20;
    return `<path transform="translate(${dx} ${cy}) scale(${k})" d="M10 29 C0 29 0 17 10 17 C10 5 28 3 32 13 C38 3 56 7 54 19 C66 19 66 29 56 29 Z" fill="#fff" stroke="${INK}" stroke-width="2.5" opacity=".9"/>`;
  }).join('');
  let out = clouds;
  let i = 1;
  while (i < pts.length) {
    const band = bandOf(grades[i]);
    let j = i;
    while (j + 1 < pts.length && bandOf(grades[j + 1]) === band) j++;
    let d = `M${x(i - 1)} ${CHART.bottom}`;
    for (let k = i - 1; k <= j; k++) d += ` L${x(k)} ${y(k)}`;
    d += ` L${x(j)} ${CHART.bottom} Z`;
    out += `<path d="${d}" fill="${band.color}"/>`;
    i = j + 1;
  }
  return out;
}

function profileOverlay(p, t) {
  const { pts, grades } = p;
  const { x, y } = profileGeometry(p);
  const last = pts.length - 1;
  let line = `M${x(0)} ${y(0)}`;
  for (let i = 1; i < pts.length; i++) line += ` L${x(i)} ${y(i)}`;

  const hiIdx = pts.reduce((m, q, i) => q.e > pts[m].e ? i : m, 0);
  const fx = x(hiIdx), fy = y(hiIdx);
  const flutter = t % 2 ? 'M0 0 L20 4 L0 11 Z' : 'M0 0 Q12 -2 20 5 Q10 7 0 11 Z';
  const flag = hiIdx < last - 2 ? `
    <g transform="translate(${fx} ${fy})">
      <path d="M0 0 V-30" stroke="${INK}" stroke-width="3" stroke-linecap="round"/>
      <path transform="translate(0 -30)" d="${flutter}" fill="#FF4D3D" stroke="${INK}" stroke-width="2.5" stroke-linejoin="round"/>
    </g>` : '';

  // The rider sits on the last point, tilted with the slope, bouncing once per second.
  const k = Math.max(0, last - 3);
  const angle = Math.max(-28, Math.min(28, Math.atan2(y(last) - y(k), x(last) - x(k)) * 180 / Math.PI));
  const bounce = t % 2 ? -3 : 0;
  const grade = grades[last];
  const effort = grade >= 6 && t % 2 === 0
    ? `<path d="M-30 -36 l-6 -5 M-22 -42 l-2 -7 M-12 -40 l3 -7" stroke="${INK}" stroke-width="2.5" stroke-linecap="round"/>` : '';
  const wind = grade < 0
    ? `<path d="M${-70 + (t % 3) * 6} -14 h22 M${-62 + (t % 3) * 6} -4 h16" stroke="#fff" stroke-width="4" stroke-linecap="round"/>` : '';
  const rider = `
    <g transform="translate(${x(last)} ${y(last) + bounce}) rotate(${angle})">
      ${wind}
      <g transform="translate(-50 -30)" stroke="${INK}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" fill="none">
        <circle cx="11" cy="23" r="9" fill="#fff"/><circle cx="47" cy="23" r="9" fill="#fff"/>
        <g transform="rotate(${t * 45} 11 23)"><path d="M2 23 h18 M11 14 v18" stroke-width="1.8"/></g>
        <g transform="rotate(${t * 45} 47 23)"><path d="M38 23 h18 M47 14 v18" stroke-width="1.8"/></g>
        <path d="M11 23 L22 8 L40 8 L47 23 M22 8 L30 23 L40 8 M30 23 L11 23 M20 4 L26 4 M40 8 L38 2 L44 2"/>
      </g>
      ${effort}
    </g>
    <circle cx="${x(last)}" cy="${y(last)}" r="6" fill="#fff" stroke="${INK}" stroke-width="3"/>`;

  return `
    <path d="M${CHART.left} ${CHART.bottom} H${CHART.right}" stroke="${INK}" stroke-width="3" stroke-linecap="round"/>
    <path d="${line}" fill="none" stroke="${INK}" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
    ${flag}${rider}`;
}

function profileHtml(p, t) {
  const { pts, grades, ascent } = p;
  const { x, y, hi, lo } = profileGeometry(p);
  const last = pts.length - 1;
  const grade = grades[last];
  const band = bandOf(grade);
  const steep = grade >= 9;
  const badgeTilt = steep ? (t % 2 ? 4 : -4) : 2;
  const total = pts[last].d / 1000;
  const hiIdx = pts.reduce((m, q, i) => q.e > pts[m].e ? i : m, 0);
  const summit = hiIdx < last - 2
    ? `<div class="label${x(hiIdx) > 300 ? ' tail-right' : ''}" style="${x(hiIdx) > 300 ? `left:auto; right:${480 - x(hiIdx) + 6}px` : `left:${x(hiIdx) + 8}px`}; top:${y(hiIdx) - SPLIT - 50}px; font-size:12px; transform: rotate(-4deg)">Gipfel ${Math.round(hi)} m</div>` : '';
  const bubbleTop = Math.max(y(last) - SPLIT - 44, 84);
  return `
    <div class="stat" style="left:16px"><div class="cap">Höhe</div><div class="num outline">${Math.round(pts[last].e)}<small>m</small></div></div>
    <div class="stat" style="left:150px"><div class="cap">Anstieg</div><div class="num outline"><span style="font-size:20px">▲</span>${Math.round(ascent)}<small>m</small></div></div>
    <div class="badge outline" style="background:${band.color}; transform: rotate(${badgeTilt}deg)">${grade >= 0 ? '+' : ''}${fmt(grade, 1)}<small>%</small></div>
    ${summit}
    <div class="label tail-right" style="left:auto; right:${Math.max(480 - x(last) + 60, 14)}px; top:${bubbleTop}px; transform: rotate(3deg); font-size:16px">${band.text}</div>
    <div class="footer">
      <span>0 km</span>
      <span class="legend">${bands.map(b => `<span><i style="background:${b.color}"></i>${b.label}</span>`).join('')}</span>
      <span>${Math.round(total)} km</span>
    </div>`;
}

function render(t) {
  const s = { ...base, dist: base.dist + t * base.speed / 3600 };
  const zone = s.hr <= zonesMax[0] ? 1 : s.hr <= zonesMax[1] ? 2 : s.hr <= zonesMax[2] ? 3 : s.hr <= zonesMax[3] ? 4 : 5;
  const above = s.speed >= s.avg;
  const tempState = s.temp < 0 ? 'freeze' : s.temp > 25 ? 'hot' : 'normal';
  const p = demoProfile(s.dist);

  document.getElementById('bg').innerHTML = background({
    speed: above ? '#3FBF66' : '#F2564B',
    temp: { freeze: 'url(#ice)', hot: 'url(#fire)', normal: '#FFD23F' }[tempState],
    hr: ['#A9B3BF', '#4FA3F0', '#8BD13F', '#FF9F1C', '#F2564B'][zone - 1],
    dist: '#A884F3',
  }, profileFills(p, t));
  document.getElementById('cells').innerHTML =
    speedCell(s, t) + tempCell(s, t, tempState) + hrCell(s, t, zone) + distCell(s, t);
  document.getElementById('overlay').innerHTML = profileOverlay(p, t);
  document.getElementById('profile').innerHTML = profileHtml(p, t);

  // Shrink values until they fit their cell, like autosizing text on the device.
  document.querySelectorAll('.value, .avg').forEach(el => {
    const max = el.parentElement.clientWidth - 24;
    let size = parseFloat(getComputedStyle(el).fontSize);
    while (el.scrollWidth > max && size > 20) el.style.fontSize = `${--size}px`;
  });
}

if (frame !== undefined) {
  render(Number(frame));
} else {
  let t = 0;
  render(t);
  setInterval(() => render(++t), 1000);
}
</script>
</body>
</html>
