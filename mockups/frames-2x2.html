<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Karoo Fun – Bildfolge</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #EDEAE2; font-family: "Chalkboard SE", sans-serif; font-weight: bold; padding: 14px; }
  .grid { display: grid; grid-template-columns: repeat(2, 480px); gap: 14px 18px; }
  .frame span { display: block; font-size: 16px; margin-bottom: 4px; color: #1F2328; }
  iframe { width: 480px; height: 400px; border: 0; display: block; }
</style>
</head>
<body>
<div class="grid" id="grid"></div>
<script>
const scenario = location.hash.slice(1) || 'normal';
document.getElementById('grid').innerHTML = [0, 1, 2, 3]
  .map(t => `<div class="frame"><span>Sekunde ${t + 1}</span><iframe src="mockup-2x2.html#${scenario}/${t}"></iframe></div>`)
  .join('');
</script>
</body>
</html>
