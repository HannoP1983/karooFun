# Tests on every push; a version tag (v1.2, v1.2.1, ...) additionally builds the signed APK and publishes it
# as a GitHub release. Needs the repository secrets KEYSTORE_BASE64 and KEYSTORE_PASSWORD (see README).
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          # Keeps Gradle and the dependencies between runs, so Maven Central does not throttle us (HTTP 429)
          cache: gradle

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Check tag, version and secrets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $version in app/build.gradle.kts"
            exit 1
          fi
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Secrets KEYSTORE_BASE64 and KEYSTORE_PASSWORD are missing"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KAROO_FUN_KEYSTORE: ${{ runner.temp }}/release.jks
          KAROO_FUN_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="karoo-fun-${GITHUB_REF_NAME#v}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          gh release create "$GITHUB_REF_NAME" "$apk" --title "Karoo Fun ${GITHUB_REF_NAME#v}" --generate-notes
