<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Karoo Fun – Lesbarkeit im Vergleich</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #EDEAE2; font-family: "Chalkboard SE", sans-serif; font-weight: bold; color: #1F2328; padding: 18px; }
  .grid { display: grid; grid-template-columns: repeat(3, 480px); gap: 22px 26px; }
  .head { font-size: 20px; margin-bottom: 6px; }
  .row { font-size: 16px; margin: 6px 0 4px; opacity: .75; }
  .frame { position: relative; width: 480px; height: 642px; overflow: hidden; border-radius: 20px; }
  .frame iframe, .frame img { position: absolute; inset: 0; width: 480px; height: 642px; border: 0; display: block; }
  /* Gravel simulation: motion blur plus a ghost image from the vibrating head */
  .shake { filter: blur(1.4px); }
  .shake .ghost { transform: translate(2px, 7px); opacity: .45; }
</style>
</head>
<body>
<div class="grid">
  <div><div class="head">Heute (App auf dem Karoo)</div></div>
  <div><div class="head">Variante 1 · Große Zahlen</div></div>
  <div><div class="head">Variante 2 · Fokus auf Tempo</div></div>

  <div><div class="row">ruhig</div><div class="frame"><img src="../promo/img/normal.png"></div></div>
  <div><div class="row">ruhig</div><div class="frame"><iframe src="readable.html#v1"></iframe></div></div>
  <div><div class="row">ruhig</div><div class="frame"><iframe src="readable.html#v2"></iframe></div></div>

  <div><div class="row">Schotter (Wackeln + Unschärfe simuliert)</div><div class="frame shake"><img src="../promo/img/normal.png"><img class="ghost" src="../promo/img/normal.png"></div></div>
  <div><div class="row">Schotter (Wackeln + Unschärfe simuliert)</div><div class="frame shake"><iframe src="readable.html#v1"></iframe><iframe class="ghost" src="readable.html#v1"></iframe></div></div>
  <div><div class="row">Schotter (Wackeln + Unschärfe simuliert)</div><div class="frame shake"><iframe src="readable.html#v2"></iframe><iframe class="ghost" src="readable.html#v2"></iframe></div></div>
</div>
</body>
</html>
