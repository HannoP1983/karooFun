<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Karoo Fun – Pokal oder Spital?!</title>
<style>
  :root {
    --ink: #1F2328;
    --w: 480px;
    --h: 642px;
    --num: "Arial Rounded MT Bold", sans-serif;
    --hand: "Chalkboard SE", "Comic Sans MS", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: var(--w); height: var(--h); background: #fff; overflow: hidden; }

  .tile {
    position: relative; width: var(--w); height: var(--h);
    border: 3.5px solid var(--ink); border-radius: 20px; overflow: hidden;
    color: var(--ink);
  }
  .rays { position: absolute; inset: -60%; }
  .tile::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 1;
    background-image: radial-gradient(rgba(0,0,0,.12) 1.3px, transparent 1.5px);
    background-size: 7px 7px;
  }
  .stage { position: absolute; inset: 0; z-index: 2; }
  .art { position: absolute; inset: 0; width: 100%; height: 100%; }

  .outline {
    color: #fff;
    text-shadow:
      -3px -3px 0 var(--ink), 3px -3px 0 var(--ink), -3px 3px 0 var(--ink), 3px 3px 0 var(--ink),
       0 -3px 0 var(--ink), 0 3px 0 var(--ink), -3px 0 0 var(--ink), 3px 0 0 var(--ink),
       6px 6px 0 var(--ink);
  }
  .shout {
    position: absolute; left: 0; right: 0; top: 196px; text-align: center; z-index: 3;
    font-family: var(--num); line-height: .95; letter-spacing: -1px;
  }
  .shout .big { font-size: 70px; display: block; }
  .shout .small { font-size: 30px; display: block; margin: 6px 0 4px; }
  .shout .q { color: #FF4D3D; }

  .bubble {
    position: absolute; z-index: 4; white-space: nowrap;
    font-family: var(--hand); font-weight: bold; font-size: 18px; line-height: 1;
    background: #FFF6D6; border: 3px solid var(--ink); border-radius: 16px;
    padding: 6px 12px 5px; box-shadow: 3px 3px 0 var(--ink);
  }
  .bubble::after {
    content: ""; position: absolute; left: 18px; bottom: -11px;
    border: 8px solid transparent; border-top: 10px solid var(--ink); border-bottom: 0;
  }
  .vs {
    position: absolute; z-index: 4; left: 50%; top: 66px; transform: translateX(-50%) rotate(-8deg);
    font-family: var(--num); font-size: 34px;
  }

  .panel {
    position: absolute; z-index: 4; left: 18px; right: 18px; bottom: 22px; height: 118px;
    background: #3B8CFF; border: 3.5px solid var(--ink); border-radius: 22px; box-shadow: 5px 5px 0 var(--ink);
    display: flex; align-items: center; justify-content: space-between; padding: 0 18px;
  }
  .panel .cap { font-family: var(--hand); font-weight: bold; font-size: 15px; margin-bottom: 2px; color: var(--ink); }
  .panel .speed { font-family: var(--num); font-size: 62px; line-height: 1; }
  .panel .speed small { font-size: 22px; margin-left: 3px; }
  .panel .grade {
    font-family: var(--num); font-size: 30px; line-height: 1; padding: 8px 12px;
    background: #fff; border: 3px solid var(--ink); border-radius: 18px; box-shadow: 3px 3px 0 var(--ink);
    color: var(--ink);
  }
  .panel .grade small { font-size: 15px; margin-left: 2px; }
</style>
</head>
<body>
<div class="tile">
  <div class="rays" id="rays"></div>
  <div class="stage" id="stage"></div>
</div>

<script>
// URL hash: "#" animates live at 5 fps, "#2" renders a fixed frame.
const frame = location.hash.slice(1);
const INK = '#1F2328';
const event = { speed: 72.4, grade: -8.7, threshold: 60 };
const fmt = (v, d) => v.toFixed(d).replace('.', ',');
// One saying per event, so it stays readable for the whole takeover.
const SUBTITLE = ['Festhalten!', 'Finger an die Bremse!', 'Wuuuiiii!'][frame !== '' ? 0 : Math.floor(Math.random() * 3)];

function burst(cx, cy, rOut, rIn, spikes, rot) {
  let d = '';
  for (let i = 0; i < spikes * 2; i++) {
    const r = i % 2 ? rIn : rOut * (0.9 + 0.1 * ((i * 7) % 3) / 2);
    const a = (i / (spikes * 2)) * Math.PI * 2 + rot;
    d += `${i ? 'L' : 'M'}${(cx + r * Math.cos(a)).toFixed(1)} ${(cy + r * Math.sin(a) * 0.82).toFixed(1)} `;
  }
  return d + 'Z';
}

const trophy = `
  <path d="M30 14 H90 V44 C90 70 74 84 60 86 C46 84 30 70 30 44 Z" fill="#FFC72C" stroke="${INK}" stroke-width="4" stroke-linejoin="round"/>
  <path d="M30 24 C10 22 8 52 34 58 M90 24 C110 22 112 52 86 58" fill="none" stroke="${INK}" stroke-width="4" stroke-linecap="round"/>
  <path d="M52 86 H68 V100 H52 Z" fill="#FFC72C" stroke="${INK}" stroke-width="4" stroke-linejoin="round"/>
  <path d="M36 100 H84 V116 H36 Z" fill="#B8742A" stroke="${INK}" stroke-width="4" stroke-linejoin="round"/>
  <path d="M60 30 l5 10 l11 1 l-8 7 l3 11 l-11 -6 l-11 6 l3 -11 l-8 -7 l11 -1 Z" fill="#fff" stroke="${INK}" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M40 22 V44" stroke="#FFF1B0" stroke-width="5" stroke-linecap="round"/>`;

function ambulance(t) {
  const light = t % 2 ? '#3B8CFF' : '#fff';
  const flash = t % 2 ? `<g stroke="#3B8CFF" stroke-width="4" stroke-linecap="round"><path d="M56 2 l-6 -8 M70 0 V-10 M84 2 l6 -8"/></g>` : '';
  return `
    ${flash}
    <path d="M60 6 h20 v10 h-20 Z" fill="${light}" stroke="${INK}" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M6 16 H106 V70 H6 Z" fill="#fff" stroke="${INK}" stroke-width="4" stroke-linejoin="round"/>
    <path d="M106 32 H124 L138 48 V70 H106 Z" fill="#fff" stroke="${INK}" stroke-width="4" stroke-linejoin="round"/>
    <path d="M112 38 H122 L130 48 H112 Z" fill="#9FD6F2" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>
    <path d="M48 26 h14 v12 h12 v14 h-12 v12 h-14 v-12 h-12 v-14 h12 Z" fill="#FF4D3D" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="32" cy="72" r="11" fill="#fff" stroke="${INK}" stroke-width="4"/>
    <circle cx="116" cy="72" r="11" fill="#fff" stroke="${INK}" stroke-width="4"/>`;
}

// Rider shooting down a slope, motion lines behind.
function rider(t) {
  const shift = (t % 3) * 8;
  return `
    <g transform="translate(${300 + shift} ${410 + shift * 0.5}) rotate(24)">
      <g stroke="#fff" stroke-width="5" stroke-linecap="round"><path d="M-90 -6 h50 M-80 8 h36 M-100 22 h44"/></g>
      <g stroke="${INK}" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" fill="none" transform="scale(1.5) translate(-29 -17)">
        <circle cx="11" cy="23" r="9" fill="#fff"/><circle cx="47" cy="23" r="9" fill="#fff"/>
        <g transform="rotate(${t * 60} 11 23)"><path d="M2 23 h18 M11 14 v18" stroke-width="2"/></g>
        <g transform="rotate(${t * 60} 47 23)"><path d="M38 23 h18 M47 14 v18" stroke-width="2"/></g>
        <path d="M11 23 L22 8 L40 8 L47 23 M22 8 L30 23 L40 8 M30 23 L11 23 M20 4 L26 4 M40 8 L38 2 L44 2"/>
      </g>
    </g>`;
}

function render(t) {
  const rot = (t % 2) * 7.5;
  document.getElementById('rays').style.background =
    `repeating-conic-gradient(from ${rot}deg at 50% 50%, #FF5A3C 0deg 7.5deg, #FFB627 7.5deg 15deg)`;

  const shake = [[0, 0], [-4, 3], [4, -2], [-2, -3]][t % 4];
  const trophyBig = t % 2 === 0;
  const subtitle = SUBTITLE;
  const pulse = 1 + (t % 2) * 0.04;

  document.getElementById('stage').innerHTML = `
    <div style="position:absolute; inset:0; transform: translate(${shake[0]}px, ${shake[1]}px)">
      <svg class="art" viewBox="0 0 480 642">
        <g transform="translate(240 290) scale(${pulse}) translate(-240 -290)">
          <path d="${burst(246, 296, 228, 168, 18, t * 0.06)}" fill="${INK}"/>
          <path d="${burst(240, 290, 228, 168, 18, t * 0.06)}" fill="#FFE135" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/>
        </g>
        <g transform="translate(${trophyBig ? 14 : 24} ${trophyBig ? 14 : 24}) scale(${trophyBig ? 1.15 : 0.95}) rotate(${trophyBig ? -8 : -2} 60 60)">${trophy}</g>
        <g transform="translate(${trophyBig ? 318 : 304} ${trophyBig ? 52 : 40}) scale(${trophyBig ? 1 : 1.18}) rotate(${trophyBig ? 4 : 8} 70 40)">${ambulance(t)}</g>
        ${rider(t)}
      </svg>
      <div class="vs outline">VS</div>
      <div class="shout outline">
        <span class="big">POKAL</span>
        <span class="small">oder</span>
        <span class="big">SPITAL<span class="q">?!</span></span>
      </div>
      <div class="bubble" style="left:40px; top:420px; transform: rotate(${t % 2 ? -5 : -2}deg)">${subtitle}</div>
    </div>
    <!-- Outside the shaking layer and only refreshed once per second (5 frames), so it stays readable. -->
    <div class="panel">
      <div>
        <div class="cap">Tempo · über ${event.threshold} km/h!</div>
        <div class="speed outline">${fmt(event.speed + Math.floor(t / 5) * 0.6, 1)}<small>km/h</small></div>
      </div>
      <div class="grade">▼ ${fmt(event.grade, 1)}<small>%</small></div>
    </div>`;
}

if (frame !== '') {
  render(Number(frame));
} else {
  let t = 0;
  render(t);
  setInterval(() => render(++t), 200);
}
</script>
</body>
</html>
