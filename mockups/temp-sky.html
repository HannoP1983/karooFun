<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Karoo Fun – Temperatur mit Sonnenstand und Mond</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #2b2b2b; color: #eee; font-family: "Chalkboard SE", sans-serif; padding: 24px; width: 1280px; }
  h1 { font-size: 26px; margin-bottom: 4px; }
  h2 { font-size: 20px; margin: 24px 0 4px; color: #FFD23F; }
  p.note { font-size: 14px; color: #bbb; margin-bottom: 10px; max-width: 1220px; }
  .row { display: flex; gap: 14px; flex-wrap: wrap; }
  .frame { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 13px; color: #aaa; }
  svg { display: block; }
</style>
</head>
<body>
<h1>Temperatur-Zelle: Himmel nach echtem Sonnenstand</h1>
<p class="note">Sonnenhöhe und Mondphase werden aus GPS-Position und Uhrzeit berechnet. Zelle 239 × 160 px, hier 1,2×. Die Deko liegt immer unter der Zahl.</p>
<div id="out"></div>
<script>
const INK = '#1F2328', W = 239, H = 160;
const st = (fill, w = 3) => `fill="${fill}" stroke="${INK}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"`;
const circle = (cx, cy, r, fill, w = 3) => `<circle cx="${cx}" cy="${cy}" r="${r}" ${st(fill, w)}/>`;
let uid = 0;

function tag(text, bg = '#FFF6D6') {
  const w = text.length * 11 + 22;
  return `<g transform="rotate(-3 50 24)">
    <rect x="10" y="8" width="${w}" height="30" rx="12" fill="${INK}" transform="translate(3,3)"/>
    <rect x="10" y="8" width="${w}" height="30" rx="12" ${st(bg)}/>
    <text x="${10 + w / 2}" y="30" text-anchor="middle" font-family="Chalkboard SE" font-weight="bold" font-size="20" fill="${INK}">${text}</text></g>`;
}
function bigNumber(whole, dec, color = '#fff') {
  const t = `<tspan>${whole}</tspan><tspan font-size="58">${dec}</tspan><tspan font-size="30">°</tspan>`;
  const base = `x="${W / 2}" y="106" text-anchor="middle" font-family="Arial Rounded MT Bold" font-size="96" letter-spacing="-2"`;
  return `<text ${base} fill="${INK}" stroke="${INK}" stroke-width="10" stroke-linejoin="round" transform="translate(6,6)">${t}</text>
    <text ${base} fill="${INK}" stroke="${INK}" stroke-width="10" stroke-linejoin="round">${t}</text>
    <text ${base} fill="${color}">${t}</text>`;
}
function sky(stops) {
  const id = 'g' + (uid++);
  return `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">${stops.map(([o, c]) => `<stop offset="${o}" stop-color="${c}"/>`).join('')}</linearGradient></defs>
    <rect width="${W}" height="${H}" fill="url(#${id})"/>`;
}
function halftone() {
  const id = 'd' + (uid++);
  return `<pattern id="${id}" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="3.5" cy="3.5" r="1.3" fill="rgba(0,0,0,.08)"/></pattern><rect width="${W}" height="${H}" fill="url(#${id})"/>`;
}

/* Sun with rays; low sun gets bigger, redder and shorter rays */
function sun(cx, cy, r, color, rays, f) {
  let s = '';
  for (let k = 0; k < 10; k++) {
    const a = k * Math.PI / 5 + f * Math.PI / 20;
    s += `<line x1="${cx}" y1="${cy}" x2="${cx + rays * Math.cos(a)}" y2="${cy + rays * Math.sin(a)}" stroke="${INK}" stroke-width="3.5" stroke-linecap="round"/>`;
  }
  return s + circle(cx, cy, r, color, 3.5);
}
function cloud(x, y, fill = '#fff', k = 1) {
  return `<path transform="translate(${x},${y}) scale(${k})" d="M8,0 C0,0 0,-10 8,-10 C8,-20 23,-22 26,-13 C31,-21 46,-18 44,-8 C54,-8 54,0 46,0 Z" ${st(fill)}/>`;
}
function hills(fill, back) {
  return `<path d="M-2,${H + 2} L-2,${H - 26} C30,${H - 40} 60,${H - 38} 95,${H - 24} C130,${H - 12} 170,${H - 44} ${W + 2},${H - 30} L${W + 2},${H + 2} Z" ${st(back)}/>
    <path d="M-2,${H + 2} L-2,${H - 12} C40,${H - 24} 80,${H - 6} 120,${H - 14} C160,${H - 22} 200,${H - 10} ${W + 2},${H - 16} L${W + 2},${H + 2} Z" ${st(fill)}/>`;
}
function star(x, y, r, on) {
  const p = [];
  for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4 - Math.PI / 2, rr = k % 2 ? r * 0.4 : r; p.push(`${x + rr * Math.cos(a)},${y + rr * Math.sin(a)}`); }
  return `<polygon points="${p.join(' ')}" fill="${on ? '#FFF6C9' : '#C9D3F2'}" stroke="${INK}" stroke-width="1.8" stroke-linejoin="round" transform="scale(1)"/>`;
}
/* Moon with real phase: 0 = new, 0.25 = first quarter, 0.5 = full, 0.75 = last quarter */
function moon(cx, cy, r, phase) {
  const lit = '#FFF4C2', dark = '#55618A';
  const k = Math.cos(2 * Math.PI * phase);
  const waxing = phase < 0.5;
  const rx = Math.abs(k) * r;
  const side = waxing ? 1 : 0;
  // lit half on the right while waxing, terminator ellipse bulges in or out
  const sweep = (k > 0) === waxing ? 0 : 1;
  const litPath = `M${cx},${cy - r} A${r},${r} 0 0 ${side} ${cx},${cy + r} A${rx},${r} 0 0 ${sweep} ${cx},${cy - r} Z`;
  return `<circle cx="${cx + 3}" cy="${cy + 3}" r="${r}" fill="${INK}"/><circle cx="${cx}" cy="${cy}" r="${r}" fill="${dark}"/>
    <path d="${litPath}" fill="${lit}"/>
    <circle cx="${cx + (waxing ? 6 : -6)}" cy="${cy - 6}" r="3" fill="rgba(0,0,0,.08)"/><circle cx="${cx + (waxing ? 10 : -10)}" cy="${cy + 7}" r="2.2" fill="rgba(0,0,0,.08)"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${INK}" stroke-width="3"/>`;
}
function stars(f) {
  const list = [[100, 14, 5], [138, 30, 4], [165, 10, 3.5], [20, 128, 4], [214, 132, 3.5], [120, 150, 3], [66, 146, 3.5]];
  return list.map(([x, y, r], i) => star(x, y, (i + f) % 3 === 0 ? r * 1.4 : r, (i + f) % 3 === 0)).join('');
}

/* ---------- Variante A: der ganze Himmel ---------- */
const A = {
  noon: f => sky([[0, '#FFD23F'], [1, '#FFD23F']]) + sun(W - 32, 30, 25, '#FF9F1C', 46, f) + cloud(8 + (f % 6) * 5, H - 8),
  afternoon: f => sky([[0, '#FFD866'], [1, '#FFB347']]) + sun(W - 26, 58, 26, '#FF8A1C', 42, f) + cloud(8 + (f % 6) * 5, H - 8),
  golden: f => sky([[0, '#FF9F45'], [0.6, '#FF7A59'], [1, '#F2566B']]) + sun(W - 34, H - 30, 30, '#FF4E1F', 38, f) + hills('#8A3E6B', '#B4507A'),
  dusk: f => sky([[0, '#3D3A8C'], [0.55, '#8E4B9C'], [1, '#FF8A65']]) + stars(f).split('</polygon>').slice(0, 3).join('</polygon>') + moon(W - 34, 32, 18, 0.3) + hills('#2E2350', '#4B336E'),
  night: (f, phase = 0.5) => sky([[0, '#14203F'], [1, '#2D3F72']]) + stars(f) + moon(W - 34, 32, 21, phase) + cloud(10 + (f % 6) * 4, H - 8, '#8592BA'),
};
/* ---------- Variante B: Sonnenbogen oben rechts ---------- */
function arcScene(bg, t, night, f, phase = 0.5) {
  const x0 = 102, x1 = 228, base = 40, top = 6;
  const x = x0 + (x1 - x0) * t, y = base - (base - top) * Math.sin(Math.PI * t);
  let s = sky(bg) + `<path d="M${x0},${base} Q${(x0 + x1) / 2},${top - 34} ${x1},${base}" fill="none" stroke="rgba(255,255,255,.75)" stroke-width="2.5" stroke-dasharray="3 5" stroke-linecap="round"/>`
    + `<line x1="${x0 - 6}" y1="${base}" x2="${x1 + 6}" y2="${base}" stroke="${INK}" stroke-width="2.5" stroke-linecap="round"/>`;
  s += night ? (stars(f) + moon(x, y, 12, phase)) : sun(x, y, 12, '#FF9F1C', 20, f);
  return s;
}
const B = {
  morning: f => arcScene([[0, '#FFD23F'], [1, '#FFD23F']], 0.25, false, f) + cloud(8 + (f % 6) * 5, H - 8),
  evening: f => arcScene([[0, '#FF9F45'], [1, '#F2566B']], 0.9, false, f),
  night: f => arcScene([[0, '#14203F'], [1, '#2D3F72']], 0.4, true, f, 0.3),
};

function cell(scene, f, num = ['14', ',6'], tagText = 'Temp', scale = 1.2) {
  return `<svg width="${W * scale}" height="${H * scale}" viewBox="0 0 ${W} ${H}"><g>
    ${scene(f)}${halftone()}${tagText ? tag(tagText) : ''}${bigNumber(...num)}
    <rect x="1.5" y="1.5" width="${W - 3}" height="${H - 3}" fill="none" stroke="${INK}" stroke-width="3" rx="4"/></g></svg>`;
}
function frost(f) {
  let s = sky([[0, '#14203F'], [1, '#3A5A8C']]) + stars(f) + moon(W - 30, 50, 16, 0.5);
  const hs = [16, 26, 12, 30, 18, 14, 27, 17, 11, 24, 15, 22], step = W / hs.length;
  hs.forEach((len, i) => { const x = i * step; s += `<path d="M${x},-2 L${x + step},-2 Q${x + step * .7},${len * .6} ${x + step / 2},${len} Q${x + step * .3},${len * .6} ${x},-2Z" ${st('#F4FBFF', 2.2)}/>`; });
  s += `<path d="M-2,${H + 2} L-2,${H - 18} C${W * .09},${H - 28} ${W * .19},${H - 24} ${W * .27},${H - 16} C${W * .35},${H - 8} ${W * .43},${H - 28} ${W * .55},${H - 26} C${W * .66},${H - 24} ${W * .7},${H - 12} ${W * .8},${H - 16} C${W * .88},${H - 20} ${W * .94},${H - 30} ${W + 2},${H - 24} L${W + 2},${H + 2}Z" ${st('#fff')}/>`;
  return s;
}

const sections = [
  ['Tagsüber: der Himmel folgt der Sonne', 'Hintergrund und Sonne folgen dem echten Sonnenstand. Je tiefer die Sonne, desto weiter rutscht sie nach unten, wird größer und röter. Nachts: dunkelblauer Himmel, Mond in der echten Phase, Sterne funkeln abwechselnd.', [
    [A.noon, 'Mittag · Sonne 55°'], [A.afternoon, 'Nachmittag · 20°'], [A.golden, 'Abendsonne · 3°'], [A.dusk, 'Dämmerung · −4°'],
  ]],
  ['Nachts: Mond in echter Phase', 'Der Mond zeigt die tatsächliche Phase. Bei Neumond nur Sterne.', [
    [f => A.night(f, 0.5), 'Vollmond'], [f => A.night(f, 0.25), 'Zunehmender Halbmond'], [f => A.night(f, 0.12), 'Zunehmende Sichel'], [f => A.night(f, 0.8), 'Abnehmende Sichel'],
  ]],
  ['Bonus – Frost bei Nacht', 'Eiszapfen und Schnee bleiben, der Himmel wird trotzdem nachts dunkel und bekommt den Mond. Hitze nachts analog.', [
    [frost, 'Frost · Nacht'],
  ]],
];
let html = '';
for (const [title, note, list] of sections) {
  html += `<h2>${title}</h2><p class="note">${note}</p><div class="row">`;
  for (const [scene, label] of list) {
    const num = scene === frost ? ['−3', ',2'] : ['14', ',6'];
    html += `<div class="frame">${cell(scene, 0, num, scene === frost ? 'Eisig' : 'Temp')}<span>${label}</span></div>`;
  }
  html += '</div>';
}
document.getElementById('out').innerHTML = html;
</script>
</body>
</html>
